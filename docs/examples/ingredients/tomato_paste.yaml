# EXAMPLE DATA. Nutrition values are ILLUSTRATIVE ROUND NUMBERS, not USDA data.
# `source.dataset: example_placeholder` is rejected by CI inside data/. Replace with real,
# reviewed USDA snapshot values (with fdc_id) before using any of this in the library.
schema_version: 1
id: tomato_paste
names: {en: Tomato paste, tr: Domates salçası}
aliases:
  en: [tomato paste, tomato puree]
  tr: [domates salçası, salça]
source: {dataset: example_placeholder, fdc_id: null, snapshot_date: null}
per_100g: {kcal: 82, protein_g: 4.3, fat_g: 0.5, carbs_g: 18.9, fiber_g: 4.1}
allergens: []
diet_flags: []
shopping:
  section: canned
  pack_sizes_g: [200, 700]
  staple: false
edible_fraction: 1.0
portion_step_g: 5
validation: {kcal_check: exempt, reason: carbohydrate figure includes fiber that is only partly digestible}
