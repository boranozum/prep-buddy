[project]
name = "prep-buddy-solver"
version = "0.0.0"
description = "Prep Buddy solver service: FastAPI + OR-Tools CP-SAT, and the Python verifier."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.26",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
extend-exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
exclude = ["generated/"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "generated"]
